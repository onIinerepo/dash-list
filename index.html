<!DOCTYPE html>

<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OTT IPTV Player</title>

  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #222;
      font-size: 20px;
      font-weight: bold;
    }

    .channels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      padding: 15px;
    }

    button {
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    .player-container {
      width: 100%;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      max-width: 1200px;
      margin: auto;
      background: #000;
    }
  </style>

</head>

<body>

  <header>
    OTT IPTV
  </header>

  <div class="player-container">
    <video id="videoPlayer" controls autoplay playsinline></video>
  </div>

  <div class="channels">

```
<button onclick="playChannel('NOT_AVAILABLE_401.mpd')">
  NOT AVAILABLE 401
</button>
```

  </div>

  <script>
    const video = document.getElementById("videoPlayer");

    const player = dashjs.MediaPlayer().create();

    function playChannel(mpd) {
      player.attachSource(mpd);
    }

    playChannel("NOT_AVAILABLE_401.mpd");
  </script>

</body>
</html>
